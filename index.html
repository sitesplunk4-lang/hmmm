<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizkyTools | Console</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #000000;
    --panel: rgba(12, 12, 14, 0.9);
    --border: rgba(255, 255, 255, 0.08);
    --text-main: #ffffff;
    --text-muted: #888888;
    --success: #22c55e;
    --danger: #ef4444;
    --warn: #f59e0b;
    --font-sans: 'Inter', sans-serif;
    --font-mono: 'Fira Code', monospace;
}

body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px 15px;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.03) 0%, transparent 60%);
    z-index: -2;
}

.console {
    width: 950px;
    max-width: 100%;
    background: var(--panel);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; background: #000; border: 1px solid #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #fff; }
.brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
.brand p { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
.status { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 8px 16px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.tab:hover { color: var(--text-main); border-color: rgba(255,255,255,0.2); }
.tab.active { background: #fff; border-color: #fff; color: #000; }

.panel { display: none; animation: fadeIn 0.3s ease; }
.panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

label { display: block; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
textarea, input[type="text"], input[type="number"] { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text-main); font-family: var(--font-mono); font-size: 12px; outline: none; margin-bottom: 12px; resize: vertical; }
textarea:focus, input:focus { border-color: #fff; }

.btn-group { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
button { padding: 10px 20px; border: none; border-radius: 8px; font-family: var(--font-sans); font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-primary { background: #fff; color: #000; width: 100%; }
.btn-primary:hover { background: #d4d4d4; }
.btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
.btn-secondary:hover { background: rgba(255,255,255,0.2); }
.btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
.btn-danger:hover { background: rgba(239, 68, 68, 0.3); }
.btn-sm { padding: 6px 12px; font-size: 11px; }

.toggle-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; }
.toggle-text h4 { font-size: 12px; font-weight: 700; }
.toggle-text p { font-size: 11px; color: var(--text-muted); }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--success); }
input:checked + .slider:before { transform: translateX(18px); }

.result-box { margin-top: 20px; padding: 20px; background: #000; border: 1px solid var(--border); border-radius: 12px; display: none; }
.result-box.valid { border-color: var(--success); }
.result-box.invalid { border-color: var(--danger); }
.result-box.warn { border-color: var(--warn); }

.profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.avatar { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--border); object-fit: cover; background: #111; }
.profile-info h2 { font-size: 18px; font-weight: 800; }
.profile-info p { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

.grid-data { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.data-group h4 { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.data-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; font-family: var(--font-mono); }
.data-row span:first-child { color: var(--text-muted); }
.data-row span:last-child { font-weight: 600; }

.items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 8px; margin-top: 8px; }
.item-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 6px; padding: 6px; text-align: center; }
.item-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; margin-bottom: 4px; background: #111; }
.item-card .name { font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.item-card .value { font-size: 10px; color: var(--success); font-weight: 700; margin-top: 2px; }

.cookie-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: var(--font-mono); font-size: 11px; word-break: break-all; margin-bottom: 12px; color: var(--success); }

.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #111; border: 1px solid var(--border); border-left: 3px solid #fff; padding: 12px 18px; border-radius: 6px; font-size: 12px; font-weight: 600; animation: slideIn 0.3s ease; }
.toast.error { border-left-color: var(--danger); }
.toast.success { border-left-color: var(--success); }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

.footer { text-align: center; margin-top: 24px; font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 1px; }
input[type="file"] { display: none; }

@media (max-width: 600px) {
    .console { padding: 16px; }
    .grid-data { grid-template-columns: 1fr; }
    .tabs { gap: 4px; }
    .tab { padding: 6px 12px; font-size: 11px; }
    .header { flex-direction: column; align-items: flex-start; gap: 12px; }
}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="console">
    <div class="header">
        <div class="brand">
            <div class="logo">RZ</div>
            <div>
                <h1>RizkyTools</h1>
                <p>Console v3.3</p>
            </div>
        </div>
        <div class="status">
            <div class="status-dot"></div>
            <span>ONLINE</span>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('refresh', this)">Refresh</div>
        <div class="tab" onclick="switchTab('mass', this)">Mass Checker</div>
        <div class="tab" onclick="switchTab('lookup', this)">Lookup</div>
        <div class="tab" onclick="switchTab('tax', this)">Tax Calculator</div>
    </div>

    <!-- PANEL REFRESH -->
    <div id="panel-refresh" class="panel active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>.ROBLOSECURITY COOKIE</label>
            <div style="display:flex; gap:6px;">
                <button class="btn-secondary btn-sm" onclick="pasteText('cookieInput')">Paste</button>
                <button class="btn-danger btn-sm" onclick="clearText('cookieInput')">Clear</button>
            </div>
        </div>
        <textarea id="cookieInput" rows="3" placeholder="_|WARNING:-DO-NOT-SHARE-THIS..."></textarea>
        
        <div class="toggle-container">
            <div class="toggle-text">
                <h4>Deep Account Info</h4>
                <p>Robux, Limiteds, Games, Security & Billing</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="getAccountInfo">
                <span class="slider"></span>
            </label>
        </div>

        <button class="btn-primary" onclick="refreshCookie()">Refresh Cookie</button>
        
        <div id="refreshResult" class="result-box"></div>
    </div>

    <!-- PANEL MASS CHECKER -->
    <div id="panel-mass" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>MASS CHECKER (MAX 2000)</label>
            <div style="display:flex; gap:6px;">
                <button class="btn-secondary btn-sm" onclick="pasteText('massInput')">Paste</button>
                <button class="btn-secondary btn-sm" onclick="document.getElementById('fileInput').click()">Upload .txt</button>
                <button class="btn-danger btn-sm" onclick="clearText('massInput')">Clear</button>
            </div>
        </div>
        <input type="file" id="fileInput" accept=".txt" onchange="handleFileUpload(event)">
        <textarea id="massInput" rows="5" placeholder="cookie1&#10;cookie2&#10;cookie3..."></textarea>
        <div class="btn-group">
            <button class="btn-primary" onclick="massCheck()" style="flex:1;">Check All</button>
            <button class="btn-secondary" onclick="exportCSV()" style="flex:1;">Export CSV</button>
        </div>
        <div id="massResult" class="result-box" style="white-space: pre-wrap; font-family: var(--font-mono); font-size: 11px;"></div>
    </div>

    <!-- PANEL LOOKUP -->
    <div id="panel-lookup" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>USERNAME</label>
            <div style="display:flex; gap:6px;">
                <button class="btn-secondary btn-sm" onclick="pasteText('lookupName')">Paste</button>
                <button class="btn-danger btn-sm" onclick="clearText('lookupName')">Clear</button>
            </div>
        </div>
        <input type="text" id="lookupName" placeholder="Enter Roblox username...">
        <button class="btn-primary" onclick="lookupUser()">Search Account</button>
        <div id="lookupResult" class="result-box"></div>
    </div>

    <!-- PANEL TAX -->
    <div id="panel-tax" class="panel">
        <label>TAX CALCULATOR</label>
        <div style="display:flex; gap:8px; margin-bottom:16px;">
            <input type="number" id="taxAmount" placeholder="Amount" min="1" style="margin:0;">
            <select id="taxMode" style="background:rgba(0,0,0,0.8); border:1px solid var(--border); border-radius:8px; padding:0 12px; color:#fff; outline:none; font-size:12px; font-weight:600;">
                <option value="charge">Selling</option>
                <option value="receive">Receiving</option>
            </select>
        </div>
        <button class="btn-primary" onclick="calcTax()">Calculate</button>
        <div id="taxResult" class="result-box" style="text-align:center; font-size:16px; font-weight:700;"></div>
    </div>
</div>

<div class="footer">RIZKYTOOLS &copy; 2026</div>

<script>
const API_BASE = ''; 
let massData = [];

function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById(`panel-${name}`).classList.add('active');
}
function show(el, cls, html) { el.style.display = 'block'; el.className = 'result-box ' + cls; el.innerHTML = html; }
function toast(msg, type) { 
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast ' + (type || '');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = '0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
}
function pasteText(id) { navigator.clipboard.readText().then(text => { document.getElementById(id).value = text; toast('Pasted!'); }).catch(() => toast('Failed to paste.', 'error')); }
function clearText(id) { document.getElementById(id).value = ''; toast('Cleared.'); }

function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('massInput').value = e.target.result;
        toast('File loaded!', 'success');
    };
    reader.readAsText(file);
    event.target.value = ''; 
}

function renderAccountCard(u, t) {
    let limitedsHtml = t.topLimited && t.topLimited.length > 0 ? `<div class="items-grid">` + t.topLimited.map(i => `
        <div class="item-card">
            <img src="${i.image}" onerror="this.src='https://www.roblox.com/asset-thumbnail/image?assetId=0&width=150&height=150&format=png'">
            <div class="name" title="${i.name}">${i.name}</div>
            <div class="value">${i.rap} R$</div>
        </div>`).join('') + `</div>` : `<div style="font-size:11px; color:var(--text-muted);">No limited items.</div>`;

    let gamesHtml = t.topGames && t.topGames.length > 0 ? `<div class="items-grid">` + t.topGames.map(g => `
        <div class="item-card">
            <img src="${g.image}" onerror="this.style.display='none'">
            <div class="name" title="${g.name}">${g.name}</div>
        </div>`).join('') + `</div>` : `<div style="font-size:11px; color:var(--text-muted);">No games.</div>`;

    let outfitsHtml = t.outfits && t.outfits.length > 0 ? `<div class="items-grid">` + t.outfits.map(o => {
        let priceText = (o.totalRobux !== undefined && o.totalRobux !== null) ? `<div class="value">${o.totalRobux} R$</div>` : '';
        return `<div class="item-card"><img src="${o.image}" onerror="this.style.display='none'"><div class="name" title="${o.name}">${o.name}</div>${priceText}</div>`;
    }).join('') + `</div>` : `<div style="font-size:11px; color:var(--text-muted);">No outfits.</div>`;

    let animsHtml = t.animations && t.animations.length > 0 ? `<div class="items-grid">` + t.animations.map(a => `
        <div class="item-card">
            <img src="${a.image || 'https://www.roblox.com/asset-thumbnail/image?assetId=0&width=150&height=150&format=png'}" onerror="this.style.display='none'">
            <div class="name" title="${a.name}">${a.name}</div>
        </div>`).join('') + `</div>` : `<div style="font-size:11px; color:var(--text-muted);">No animations.</div>`;

    let securityHtml = `
        <div class="data-row"><span>Email</span><span style="color:${t.emailStatus === 'Verified' ? 'var(--success)' : 'var(--warn)'}">${t.emailStatus || 'Unknown'}</span></div>
        <div class="data-row"><span>2FA</span><span style="color:${t.twoFactor === 'Authenticator' || t.twoFactor === 'Email' ? 'var(--success)' : 'var(--danger)'}">${t.twoFactor || 'Disabled'}</span></div>
        <div class="data-row"><span>Age Verified</span><span>${t.ageVerified ? 'Yes' : 'No'}</span></div>
    `;

    const avatarImg = u.avatarUrl || 'https://www.roblox.com/headshot-thumbnail/image?userId=1&width=150&height=150&format=png';
    const premiumIcon = t.premium ? `<span style="color:#00A2FF; font-size:12px;" title="Premium">&#10004;</span>` : '';

    return `
        <div class="profile-header">
            <img src="${avatarImg}" class="avatar" onerror="this.src='https://www.roblox.com/headshot-thumbnail/image?userId=1&width=150&height=150&format=png'">
            <div class="profile-info">
                <h2>${u.name} ${premiumIcon}</h2>
                <p>${u.displayName} &bull; ID: ${u.id}</p>
            </div>
        </div>
        
        <div class="grid-data">
            <div class="data-group">
                <h4>Account</h4>
                <div class="data-row"><span>Age</span><span>${u.ageDays || 'N/A'} Days</span></div>
                <div class="data-row"><span>Banned</span><span style="color:${u.isBanned ? 'var(--danger)' : 'var(--success)'}">${u.isBanned ? 'YES' : 'NO'}</span></div>
                <div class="data-row"><span>Robux</span><span style="color:var(--success)">${t.robux !== null ? t.robux + ' R$' : 'N/A'}</span></div>
                <div class="data-row"><span>RAP</span><span>${t.rap || 0} R$</span></div>
                <div class="data-row"><span>Limiteds</span><span>${t.limitedCount || 0}</span></div>
            </div>
            <div class="data-group">
                <h4>Security</h4>
                ${securityHtml}
            </div>
        </div>

        <div class="data-group" style="margin-bottom:16px;"><h4>Limiteds</h4>${limitedsHtml}</div>
        <div class="data-group" style="margin-bottom:16px;"><h4>Games</h4>${gamesHtml}</div>
        <div class="data-group" style="margin-bottom:16px;"><h4>Outfits</h4>${outfitsHtml}</div>
        <div class="data-group"><h4>Animations</h4>${animsHtml}</div>
    `;
}

async function refreshCookie() {
    const cookie = document.getElementById('cookieInput').value.trim();
    const getInfo = document.getElementById('getAccountInfo').checked;
    const resultDiv = document.getElementById('refreshResult');
    if (!cookie) return toast('Cookie is empty!', 'error');
    
    show(resultDiv, '', '<div style="color:var(--text-muted); text-align:center;">Scanning...</div>');
    
    try {
        const res = await fetch(`${API_BASE}/api/refresh-cookie`, { 
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie, getAccountInfo: getInfo }) 
        });
        const data = await res.json();
        
        if (data.error) return show(resultDiv, 'invalid', `Error: ${data.error}`);
        
        let statusText = data.sameAsOld ? "Cookie is still active (No new cookie generated)" : "New Cookie Generated";
        let statusColor = data.sameAsOld ? "var(--warn)" : "var(--success)";
        
        let html = `<div style="color:${statusColor}; font-weight:800; font-size:14px; margin-bottom:12px;">${statusText}</div>`;
        html += `<div class="cookie-box">${data.newCookie || cookie}</div>`;
        html += `<button class="btn-secondary btn-sm" style="width:100%;" onclick="navigator.clipboard.writeText('${data.newCookie || cookie}'); toast('Copied!');">Copy Cookie</button>`;
        
        if (getInfo && data.account_info) {
            html += `<div style="margin-top:20px; border-top:1px solid var(--border); padding-top:16px;">` + renderAccountCard(data.account_info.user, data.account_info.telemetry) + `</div>`;
        }
        
        show(resultDiv, 'valid', html);
        toast('Refreshed!');
    } catch (e) { show(resultDiv, 'invalid', 'Server error.'); }
}

// === FITUR MASS CHECKER (BATCHING 2000 COOKIES) ===
async function massCheck() {
    const raw = document.getElementById('massInput').value.trim();
    const resultDiv = document.getElementById('massResult');
    if (!raw) return toast('Paste or upload cookies first!', 'error');
    
    const cookies = raw.split('\n').map(c => c.trim()).filter(Boolean);
    if (cookies.length > 2000) return toast('Max 2000 cookies per check!', 'error');
    
    massData = [];
    let validCount = 0;
    let invalidCount = 0;
    
    // Batching: Kirim per 30 cookie biar Netlify nggak timeout
    const BATCH_SIZE = 30;
    const totalBatches = Math.ceil(cookies.length / BATCH_SIZE);
    
    for (let i = 0; i < cookies.length; i += BATCH_SIZE) {
        const batch = cookies.slice(i, i + BATCH_SIZE);
        const batchNum = Math.floor(i / BATCH_SIZE) + 1;
        
        show(resultDiv, '', `Checking batch ${batchNum} of ${totalBatches} (${i + batch.length}/${cookies.length} cookies)...`);
        
        try {
            const res = await fetch(`${API_BASE}/api/mass-check`, { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookies: batch }) 
            });
            const data = await res.json();
            
            if (data.error) {
                show(resultDiv, 'invalid', `Error on batch ${batchNum}: ${data.error}`);
                return;
            }
            
            massData.push(...data.results);
            validCount += data.validCount;
            invalidCount += data.invalidCount;
            
        } catch (e) {
            show(resultDiv, 'invalid', `Network error on batch ${batchNum}.`);
            return;
        }
    }
    
    // Selesai semua batch, tampilkan hasilnya
    let out = `RESULTS\nTotal: ${cookies.length} | Valid: ${validCount} | Invalid: ${invalidCount}\n\n`;
    massData.forEach((r, i) => {
        if (r.valid) {
            out += `[${i+1}] VALID - ${r.username} (${r.displayName}) | ${r.robux ?? '?'} R$\n`;
        } else {
            out += `[${i+1}] INVALID\n`;
        }
    });
    
    show(resultDiv, validCount > 0 ? 'valid' : 'invalid', out);
    toast(`Done: ${validCount} valid.`);
}

function exportCSV() {
    if (massData.length === 0) return toast('No data to export!', 'error');
    const rows = [['No', 'Valid', 'Username', 'DisplayName', 'ID', 'Robux', 'Premium', 'AgeDays', 'Error']];
    massData.forEach((r, i) => rows.push([i + 1, r.valid ? 'YES' : 'NO', r.username || '', r.displayName || '', r.id || '', r.robux ?? '', r.premium ? 'YES' : 'NO', r.ageDays || '', r.error || '']));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rizkytools_mass_${Date.now()}.csv`;
    a.click();
    toast('CSV exported!', 'success');
}

async function lookupUser() {
    const username = document.getElementById('lookupName').value.trim();
    const resultDiv = document.getElementById('lookupResult');
    if (!username) return toast('Enter a username!', 'error');
    
    show(resultDiv, '', '<div style="color:var(--text-muted); text-align:center;">Searching...</div>');
    try {
        const res = await fetch(`${API_BASE}/api/lookup`, { 
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) 
        });
        const data = await res.json();
        if (data.error) return show(resultDiv, 'invalid', `Error: ${data.error}`);
        
        const u = { id: data.id, name: data.name, displayName: data.displayName, ageDays: data.ageDays, isBanned: data.isBanned, avatarUrl: data.avatarUrl };
        const t = { robux: data.telemetry?.robux, premium: data.telemetry?.premium, rap: data.telemetry?.rap, limitedCount: data.telemetry?.limitedCount, topLimited: data.telemetry?.topLimited, topGames: data.telemetry?.topGames, outfits: data.telemetry?.outfits, animations: data.telemetry?.animations, emailStatus: data.telemetry?.emailStatus, twoFactor: data.telemetry?.twoFactor, ageVerified: data.telemetry?.ageVerified, birthdate: data.telemetry?.birthdate };
        
        show(resultDiv, 'valid', renderAccountCard(u, t));
    } catch (e) { show(resultDiv, 'invalid', 'Server error.'); }
}

async function calcTax() {
    const amount = parseFloat(document.getElementById('taxAmount').value);
    const mode = document.getElementById('taxMode').value;
    const resultDiv = document.getElementById('taxResult');
    if (!amount || amount <= 0) return toast('Invalid amount!', 'error');
    
    try {
        const res = await fetch(`${API_BASE}/api/tax`, { 
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount, mode }) 
        });
        const data = await res.json();
        show(resultDiv, 'valid', `Price: <b>${data.price} R$</b> &bull; Tax: ${data.tax} R$ &bull; Net: <b style="color:var(--success)">${data.net} R$</b>`);
    } catch (e) { show(resultDiv, 'invalid', 'Error connection.'); }
}
</script>
