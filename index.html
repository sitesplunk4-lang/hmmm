<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RizkyTools | Deep Telemetry</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #000000;
    --panel: rgba(12, 12, 14, 0.8);
    --border: rgba(255, 255, 255, 0.08);
    --text-main: #ffffff;
    --text-muted: #888888;
    --success: #22c55e;
    --danger: #ef4444;
    --warn: #f59e0b;
    --accent: #f59e0b;
    --font-sans: 'Inter', sans-serif;
    --font-mono: 'Fira Code', monospace;
}

body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 0%, rgba(245,158,11,0.03) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(255,255,255,0.02) 0%, transparent 60%);
    z-index: -2;
}
body::after {
    content: 'DEEP TELEMETRY';
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
    font-size: 12vw;
    font-weight: 900;
    color: rgba(255, 255, 255, 0.01);
    z-index: -1;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
}

.console {
    width: 1100px;
    max-width: 100%;
    background: var(--panel);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
}

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 16px; }
.logo { width: 52px; height: 52px; background: #000; border: 1px solid #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #fff; letter-spacing: -1px; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
.brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.brand p { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 12px var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.tabs { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
.tab { padding: 12px 22px; background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.tab:hover { color: var(--text-main); border-color: rgba(255,255,255,0.2); }
.tab.active { background: #fff; border-color: #fff; color: #000; }

.panel { display: none; animation: fadeIn 0.3s ease; }
.panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
textarea, input[type="text"], input[type="number"], input[type="password"] { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid var(--border); border-radius: 12px; padding: 18px; color: var(--text-main); font-family: var(--font-mono); font-size: 13px; outline: none; transition: border-color 0.2s; margin-bottom: 18px; resize: vertical; }
textarea:focus, input:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }

.btn-group { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
button { padding: 14px 28px; border: none; border-radius: 12px; font-family: var(--font-sans); font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: #fff; color: #000; width: 100%; }
.btn-primary:hover { background: #d4d4d4; transform: translateY(-1px); }
.btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
.btn-secondary:hover { background: rgba(255,255,255,0.2); }
.btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
.btn-danger:hover { background: rgba(239, 68, 68, 0.3); }
.btn-sm { padding: 10px 18px; font-size: 12px; }

.result-box { margin-top: 24px; padding: 28px; background: #000; border: 1px solid var(--border); border-radius: 16px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.result-box.valid { border-color: var(--success); }
.result-box.invalid { border-color: var(--danger); }
.result-box.warn { border-color: var(--warn); }

.profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.avatar { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--border); object-fit: cover; background: #111; }
.profile-info h2 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.profile-info p { font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 4px; }

.grid-data { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; }
.data-group h4 { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.data-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; font-family: var(--font-mono); }
.data-row span:first-child { color: var(--text-muted); }
.data-row span:last-child { font-weight: 600; }

.items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; margin-top: 12px; }
.item-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; transition: border-color 0.2s; }
.item-card:hover { border-color: rgba(255,255,255,0.2); }
.item-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
.item-card .name { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.item-card .value { font-size: 11px; color: var(--success); font-weight: 700; margin-top: 4px; }

.cookie-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 16px; font-family: var(--font-mono); font-size: 12px; word-break: break-all; margin-bottom: 16px; line-height: 1.6; color: var(--success); }

.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
.toast { background: #111; border: 1px solid var(--border); border-left: 4px solid #fff; padding: 16px 24px; border-radius: 8px; font-size: 13px; font-weight: 600; animation: slideIn 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.toast.error { border-left-color: var(--danger); }
.toast.success { border-left-color: var(--success); }
@keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.footer { text-align: center; margin-top: 36px; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 1px; font-weight: 500; }

@media (max-width: 768px) {
    .console { padding: 24px; }
    .grid-data { grid-template-columns: 1fr; }
    .tabs { gap: 6px; }
    .tab { padding: 10px 16px; font-size: 12px; }
    .header { flex-direction: column; align-items: flex-start; gap: 16px; }
}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="console">
    <div class="header">
        <div class="brand">
            <div class="logo">RZ</div>
            <div>
                <h1>RizkyTools</h1>
                <p>Deep Telemetry v3.0</p>
            </div>
        </div>
        <div class="status">
            <div class="status-dot"></div>
            <span>ONLINE</span>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('refresh', this)">Refresh</div>
        <div class="tab" onclick="switchTab('lookup', this)">Lookup</div>
        <div class="tab" onclick="switchTab('changepass', this)">Change Password</div>
        <div class="tab" onclick="switchTab('bypass', this)">Bypass IP</div>
        <div class="tab" onclick="switchTab('tax', this)">Tax Calculator</div>
    </div>

    <!-- PANEL REFRESH -->
    <div id="panel-refresh" class="panel active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>.ROBLOSECURITY COOKIE</label>
            <div style="display:flex; gap:8px;">
                <button class="btn-secondary btn-sm" onclick="pasteText('cookieInput')">Paste</button>
                <button class="btn-danger btn-sm" onclick="clearText('cookieInput')">Clear</button>
            </div>
        </div>
        <textarea id="cookieInput" rows="3" placeholder="_|WARNING:-DO-NOT-SHARE-THIS..."></textarea>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding:16px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:12px;">
            <div>
                <div style="font-size:14px; font-weight:700;">Deep Account Info</div>
                <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">Robux, Limiteds, Games, Security & Billing</div>
            </div>
            <label style="margin:0; cursor:pointer; display:flex; align-items:center;">
                <input type="checkbox" id="getAccountInfo" style="width:22px; height:22px; accent-color:#fff; cursor:pointer;">
            </label>
        </div>

        <button class="btn-primary" onclick="refreshCookie()">Refresh Cookie</button>
        
        <div id="refreshResult" class="result-box"></div>
    </div>

    <!-- PANEL LOOKUP -->
    <div id="panel-lookup" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>USERNAME</label>
            <div style="display:flex; gap:8px;">
                <button class="btn-secondary btn-sm" onclick="pasteText('lookupName')">Paste</button>
                <button class="btn-danger btn-sm" onclick="clearText('lookupName')">Clear</button>
            </div>
        </div>
        <input type="text" id="lookupName" placeholder="Enter Roblox username...">
        <button class="btn-primary" onclick="lookupUser()">Search Account</button>
        <div id="lookupResult" class="result-box"></div>
    </div>

    <!-- PANEL CHANGE PASS -->
    <div id="panel-changepass" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>.ROBLOSECURITY COOKIE</label>
            <div style="display:flex; gap:8px;">
                <button class="btn-secondary btn-sm" onclick="pasteText('passCookie')">Paste</button>
                <button class="btn-danger btn-sm" onclick="clearText('passCookie')">Clear</button>
            </div>
        </div>
        <textarea id="passCookie" rows="2" placeholder="Paste cookie here..."></textarea>
        <label>NEW PASSWORD</label>
        <input type="password" id="newPassword" placeholder="Minimum 8 characters...">
        <button class="btn-primary" onclick="changePassword()">Change Password & Logout</button>
        <div id="passResult" class="result-box"></div>
    </div>

    <!-- PANEL BYPASS -->
    <div id="panel-bypass" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>.ROBLOSECURITY COOKIE</label>
            <div style="display:flex; gap:8px;">
                <button class="btn-secondary btn-sm" onclick="pasteText('bypassCookie')">Paste</button>
                <button class="btn-danger btn-sm" onclick="clearText('bypassCookie')">Clear</button>
            </div>
        </div>
        <textarea id="bypassCookie" rows="2" placeholder="Paste cookie here..."></textarea>
        <label>TARGET URL (Default: Authenticated)</label>
        <input type="text" id="bypassTarget" value="https://users.roblox.com/v1/users/authenticated">
        <button class="btn-primary" onclick="bypassCheck()">Test Bypass</button>
        <div id="bypassResult" class="result-box"></div>
    </div>

    <!-- PANEL TAX -->
    <div id="panel-tax" class="panel">
        <label>TAX CALCULATOR</label>
        <div style="display:flex; gap:12px; margin-bottom:20px;">
            <input type="number" id="taxAmount" placeholder="Amount (Robux)" min="1" style="margin:0;">
            <select id="taxMode" style="background:rgba(0,0,0,0.8); border:1px solid var(--border); border-radius:12px; padding:0 18px; color:#fff; outline:none; font-family:var(--font-sans); font-size:14px; font-weight:600;">
                <option value="charge">Selling (Charge)</option>
                <option value="receive">Receiving (Net)</option>
            </select>
        </div>
        <button class="btn-primary" onclick="calcTax()">Calculate</button>
        <div id="taxResult" class="result-box" style="text-align:center; font-size:20px; font-weight:700;"></div>
    </div>
</div>

<div class="footer">RIZKYTOOLS &copy; 2026 &bull; DEEP TELEMETRY</div>

<script>
// URL API (Kosongin kalau pakai Netlify, isi kalau pakai Cloudflare)
const API_BASE = ''; 

// Helper UI
function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById(`panel-${name}`).classList.add('active');
}
function show(el, cls, html) { el.style.display = 'block'; el.className = 'result-box ' + cls; el.innerHTML = html; }
function toast(msg, type) { 
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast ' + (type || '');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = '0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
}
function pasteText(id) { navigator.clipboard.readText().then(text => { document.getElementById(id).value = text; toast('Pasted!'); }).catch(() => toast('Failed to paste.', 'error')); }
function clearText(id) { document.getElementById(id).value = ''; toast('Cleared.'); }

// Render UI Deep Telemetry
function renderAccountCard(u, t) {
    // 1. Limiteds
    let limitedsHtml = t.topLimited && t.topLimited.length > 0 ? `<div class="items-grid">` + t.topLimited.map(i => `
        <div class="item-card">
            <img src="${i.image}" onerror="this.src='https://www.roblox.com/asset-thumbnail/image?assetId=0&width=150&height=150&format=png'">
            <div class="name" title="${i.name}">${i.name}</div>
            <div class="value">${i.rap} R$</div>
        </div>`).join('') + `</div>` : `<div style="font-size:12px; color:var(--text-muted);">No limited items found.</div>`;

    // 2. Top Games
    let gamesHtml = t.topGames && t.topGames.length > 0 ? `<div class="items-grid">` + t.topGames.map(g => `
        <div class="item-card">
            <img src="${g.image}" onerror="this.style.display='none'">
            <div class="name" title="${g.name}">${g.name}</div>
            <div class="value" style="color:var(--accent);">${g.playtime || ''}</div>
        </div>`).join('') + `</div>` : `<div style="font-size:12px; color:var(--text-muted);">No game data available.</div>`;

    // 3. Outfits
    let outfitsHtml = t.outfits && t.outfits.length > 0 ? `<div class="items-grid">` + t.outfits.map(o => `
        <div class="item-card">
            <img src="${o.image}" onerror="this.style.display='none'">
            <div class="name" title="${o.name}">${o.name}</div>
            <div class="value">${o.totalRobux} R$</div>
        </div>`).join('') + `</div>` : `<div style="font-size:12px; color:var(--text-muted);">No outfits found.</div>`;

    // 4. Animations
    let animsHtml = t.animations && t.animations.length > 0 ? `<div class="items-grid">` + t.animations.map(a => `
        <div class="item-card">
            <img src="${a.image}" onerror="this.style.display='none'">
            <div class="name" title="${a.name}">${a.name}</div>
        </div>`).join('') + `</div>` : `<div style="font-size:12px; color:var(--text-muted);">No animations found.</div>`;

    // 5. Security
    let securityHtml = `
        <div class="data-row"><span>Email Status</span><span style="color:${t.emailStatus === 'Verified' ? 'var(--success)' : 'var(--warn)'}">${t.emailStatus || 'Unknown'}</span></div>
        <div class="data-row"><span>2FA</span><span style="color:${t.twoFactor === 'Authenticator' || t.twoFactor === 'Email' ? 'var(--success)' : 'var(--danger)'}">${t.twoFactor || 'Disabled'}</span></div>
        <div class="data-row"><span>Age Verified</span><span>${t.ageVerified ? 'Yes' : 'No'}</span></div>
        <div class="data-row"><span>Birthdate</span><span>${t.birthdate || 'Hidden'}</span></div>
    `;

    const avatarImg = u.avatarUrl || 'https://www.roblox.com/headshot-thumbnail/image?userId=1&width=150&height=150&format=png';
    const premiumIcon = t.premium ? `<span style="color:#00A2FF; font-size:14px;" title="Premium">&#10004;</span>` : '';

    return `
        <div class="profile-header">
            <img src="${avatarImg}" class="avatar" onerror="this.src='https://www.roblox.com/headshot-thumbnail/image?userId=1&width=150&height=150&format=png'">
            <div class="profile-info">
                <h2>${u.name} ${premiumIcon}</h2>
                <p>${u.displayName} &bull; ID: ${u.id}</p>
            </div>
        </div>
        
        <div class="grid-data">
            <div class="data-group">
                <h4>Account Overview</h4>
                <div class="data-row"><span>Age</span><span>${u.ageDays || 'N/A'} Days</span></div>
                <div class="data-row"><span>Banned</span><span style="color:${u.isBanned ? 'var(--danger)' : 'var(--success)'}">${u.isBanned ? 'YES' : 'NO'}</span></div>
                <div class="data-row"><span>Robux</span><span style="color:var(--success)">${t.robux !== null ? t.robux + ' R$' : 'N/A'}</span></div>
                <div class="data-row"><span>RAP Total</span><span>${t.rap || 0} R$</span></div>
                <div class="data-row"><span>Limiteds</span><span>${t.limitedCount || 0} items</span></div>
            </div>
            <div class="data-group">
                <h4>Security & Identity</h4>
                ${securityHtml}
            </div>
        </div>

        <div class="data-group">
            <h4>Top Limited Items <span style="font-size:10px; color:var(--text-muted); font-weight:normal;">(RAP)</span></h4>
            ${limitedsHtml}
        </div>
        
        <div class="data-group" style="margin-top:24px;">
            <h4>Top Games Played</h4>
            ${gamesHtml}
        </div>
        
        <div class="data-group" style="margin-top:24px;">
            <h4>Avatar Outfits</h4>
            ${outfitsHtml}
        </div>

        <div class="data-group" style="margin-top:24px;">
            <h4>Avatar Animations</h4>
            ${animsHtml}
        </div>
    `;
}

// === FITUR REFRESH ===
async function refreshCookie() {
    const cookie = document.getElementById('cookieInput').value.trim();
    const getInfo = document.getElementById('getAccountInfo').checked;
    const resultDiv = document.getElementById('refreshResult');
    if (!cookie) return toast('Cookie is empty!', 'error');
    
    show(resultDiv, '', '<div style="color:var(--text-muted); text-align:center;">Scanning deep telemetry (5-15s)...</div>');
    
    try {
        const res = await fetch(`${API_BASE}/api/refresh-cookie`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ cookie, getAccountInfo: getInfo }) 
        });
        const data = await res.json();
        
        if (data.error) return show(resultDiv, 'invalid', `Error: ${data.error}`);
        
        let html = `<div style="color:var(--success); font-weight:800; font-size:16px; margin-bottom:20px;">Cookie Refreshed Successfully</div>`;
        html += `<div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">New Cookie:</div>`;
        html += `<div class="cookie-box">${data.newCookie || cookie}</div>`;
        html += `<button class="btn-secondary btn-sm" style="width:100%;" onclick="navigator.clipboard.writeText('${data.newCookie || cookie}'); toast('Cookie copied!');">Copy Cookie</button>`;
        
        if (getInfo && data.account_info) {
            html += `<div style="margin-top:32px; border-top:1px solid var(--border); padding-top:24px;">` + renderAccountCard(data.account_info.user, data.account_info.telemetry) + `</div>`;
        }
        
        show(resultDiv, 'valid', html);
        toast('Refreshed!');
    } catch (e) { show(resultDiv, 'invalid', 'Server error.'); toast('Server error', 'error'); }
}

// === FITUR LOOKUP ===
async function lookupUser() {
    const username = document.getElementById('lookupName').value.trim();
    const resultDiv = document.getElementById('lookupResult');
    if (!username) return toast('Enter a username!', 'error');
    
    show(resultDiv, '', '<div style="color:var(--text-muted); text-align:center;">Scanning account...</div>');
    try {
        const res = await fetch(`${API_BASE}/api/lookup`, { 
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) 
        });
        const data = await res.json();
        if (data.error) return show(resultDiv, 'invalid', `Error: ${data.error}`);
        
        const u = { id: data.id, name: data.name, displayName: data.displayName, ageDays: data.ageDays, isBanned: data.isBanned, avatarUrl: data.avatarUrl };
        const t = { robux: data.telemetry?.robux, premium: data.telemetry?.premium, rap: data.telemetry?.rap, limitedCount: data.telemetry?.limitedCount, topLimited: data.telemetry?.topLimited, topGames: data.telemetry?.topGames, outfits: data.telemetry?.outfits, animations: data.telemetry?.animations, emailStatus: data.telemetry?.emailStatus, twoFactor: data.telemetry?.twoFactor, ageVerified: data.telemetry?.ageVerified, birthdate: data.telemetry?.birthdate };
        
        show(resultDiv, 'valid', renderAccountCard(u, t));
    } catch (e) { show(resultDiv, 'invalid', 'Server error.'); }
}

// === FITUR GANTI PASSWORD ===
async function changePassword() {
    const cookie = document.getElementById('passCookie').value.trim();
    const newPassword = document.getElementById('newPassword').value.trim();
    const resultDiv = document.getElementById('passResult');
    if (!cookie) return toast('Cookie is empty!', 'error');
    if (newPassword.length < 8) return toast('Password min 8 chars!', 'error');

    show(resultDiv, '', '<div style="color:var(--text-muted); text-align:center;">Processing...</div>');
    try {
        const res = await fetch(`${API_BASE}/api/change-password`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie, newPassword })
        });
        const data = await res.json();
        
        if (data.success) show(resultDiv, 'valid', `<div style="color:var(--success); font-weight:800; font-size:16px;">Success</div><div style="margin-top:12px; font-size:14px;">Password changed to: <b>${newPassword}</b></div>`);
        else show(resultDiv, 'invalid', `Error: ${data.error}`);
    } catch (e) { show(resultDiv, 'invalid', 'Server error.'); }
}

// === FITUR BYPASS ===
async function bypassCheck() {
    const cookie = document.getElementById('bypassCookie').value.trim();
    const target = document.getElementById('bypassTarget').value.trim();
    const resultDiv = document.getElementById('bypassResult');
    if (!cookie) return toast('Cookie is empty!', 'error');
    
    show(resultDiv, '', '<div style="color:var(--text-muted); text-align:center;">Testing connection...</div>');
    try {
        const res = await fetch(`${API_BASE}/api/bypass-check`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cookie, target })
        });
        const data = await res.json();
        
        if (data.success) {
            show(resultDiv, 'valid', `<div style="color:var(--success); font-weight:800; font-size:16px; margin-bottom:12px;">Bypass Successful</div><div style="font-size:13px; font-family:var(--font-mono);">Status: ${data.status}</div><div style="font-size:12px; color:var(--text-muted); margin-top:12px; word-break:break-all;">${JSON.stringify(data.data)}</div>`);
        } else {
            show(resultDiv, 'warn', `<div style="color:var(--warn); font-weight:800; font-size:16px; margin-bottom:12px;">Bypass Requires Proxy</div><div style="font-size:13px; color:var(--text-muted); line-height:1.6;">Roblox blocks direct server requests. You need to set up an external proxy to bypass IP lock.</div><div style="font-size:12px; margin-top:16px; font-family:var(--font-mono); color:var(--danger);">Error: ${data.error}</div>`);
        }
    } catch (e) { show(resultDiv, 'invalid', 'Server error.'); }
}

// === FITUR TAX ===
async function calcTax() {
    const amount = parseFloat(document.getElementById('taxAmount').value);
    const mode = document.getElementById('taxMode').value;
    const resultDiv = document.getElementById('taxResult');
    if (!amount || amount <= 0) return toast('Invalid amount!', 'error');
    
    try {
        const res = await fetch(`${API_BASE}/api/tax`, { 
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount, mode }) 
        });
        const data = await res.json();
        show(resultDiv, 'valid', `Price: <b>${data.price} R$</b> &bull; Tax: ${data.tax} R$ &bull; Net: <b style="color:var(--success)">${data.net} R$</b>`);
    } catch (e) { show(resultDiv, 'invalid', 'Error connection.'); }
}
